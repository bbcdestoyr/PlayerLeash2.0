# PlayerLeash settings

# How long a leash request stays open (seconds)
request-timeout-seconds: 30

# How many pets one master can have at once
max-pets-per-master: 3

# While leashed, the pet gets gently pulled toward the master (or fence) past this distance (blocks)
pull-start-distance: 4.0

# While leashed, past this distance the pet is snapped back (blocks).
# Does NOT apply when the pet is set to walk free or has free will.
tether-teleport-distance: 25.0

# Fastest the pull can move the pet (blocks per tick)
max-pull-speed: 0.6

# Height of the rope attach point above the pet's feet (blocks).
# Tune this so the rope visually ends at the neck.
anchor-height-offset: 1.1

# false = only the owner can free a pet (with Disown in the menu or /unleash).
# true  = the pet can also free themselves with /unleash.
# Staff with playerleash.admin can always free anyone with /unleash <player>.
pet-can-unleash-self: false

# Maid dress colour for new pets:
#   1 Black & white, 2 Baby pink, 3 Lavender, 4 Mint, 5 Sky blue, 6 Navy, 7 Red, 8 Pale lilac
# The owner can switch colour any time by right-clicking the dress button in the menu.
dress-style: 8
# true = pets start out wearing the dress. false = the owner turns it on in the menu.
dress-on-by-default: false

# How the dress sticks to the player.
#   passenger = the dress rides the player (smoothest)
#   teleport  = the dress is moved to the player every tick (use this if the dress floats or sits in the wrong place)
dress-follow: passenger
# Passenger mode only: nudge the dress up (positive) or down (negative), in blocks, if it sits too high or low.
dress-height-adjust: 0.0

# Leashed pets can't fly (creative flight, /fly, elytra). They get it back when the leash comes off.
block-flying-while-leashed: true
